name: Test CineNov

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cinenov-app/package-lock.json
      - name: Install dependencies
        working-directory: cinenov-app
        run: npm ci
      - name: Run tests
        working-directory: cinenov-app
        run: npm test
